name: Build and test Android
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Configure Android SDK
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/34.0.0/aapt2" ]]; then
            JAVA_HOME="$JAVA_HOME_21_X64" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;34.0.0'
          fi
      - run: ./gradlew assembleDebug
      - run: ./gradlew testDebugUnitTest
      - run: ./gradlew lintDebug
      - name: Report verification errors
        if: failure()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          for path in Path("app/build/test-results").rglob("TEST-*.xml"):
              for test in ET.parse(path).iter("testcase"):
                  for failure in test.findall("failure"):
                      print("::error::" + test.get("name") + " - " + failure.get("message", "")[:500])
          lint = Path("app/build/reports/lint-results-debug.xml")
          if lint.exists():
              for issue in ET.parse(lint).iter("issue"):
                  if issue.get("severity") in {"Fatal", "Error"}:
                      print("::error::" + issue.get("id") + " - " + issue.get("message"))
          PYTHON
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: primeval-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: verification-reports
          path: app/build/reports/
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Grant runner access to hardware acceleration
        run: sudo setfacl -m u:$(id -un):rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: emulator-results
          path: app/build/reports/androidTests/
